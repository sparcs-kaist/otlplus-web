name: CI

on:
  push:
    branches: [main, migration, rc]
  pull_request:
    branches: [main, migration, rc]

env:
  NODE_VERSION: 18

jobs:
  format-and-lint:
    name: Format and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile
      - name: Format
        run: yarn prettier
      - name: Lint
        run: yarn lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sparcs-kaist/legacy-v3-otlplus-web
